# Generates the Linux visual baselines (tests/__screenshots__/linux) on the same runner image the
# verify workflow uses, and uploads them as an artifact. Nothing is committed automatically:
# download the artifact, review the images and commit them (ARCHITECTURE §7.1).
name: visual-baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vite build

      # --update-snapshots=all overrides the CI default ('none') for this job only.
      - name: Write @visual baselines
        run: npx playwright test --grep @visual --update-snapshots=all
        env:
          PW_SKIP_BUILD: '1'

      - name: Upload Linux baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines-linux
          path: tests/__screenshots__/linux/
          if-no-files-found: error
          retention-days: 30
