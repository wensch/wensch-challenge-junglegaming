name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # typecheck -> lint -> build -> e2e (desktop + mobile) -> @visual -> @a11y (scripts/verify.mjs)
      - name: npm run verify
        run: npm run verify

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/verify-latest.md
          retention-days: 14

      - name: Upload traces and failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      # Linux baselines written on first run (updateSnapshots: 'missing' in CI) — commit them deliberately.
      - name: Upload visual baselines (linux)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/__screenshots__/linux/
          if-no-files-found: ignore
          retention-days: 14
